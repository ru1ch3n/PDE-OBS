include: full_to_partial_base.yaml
name: full-to-partial-ufno-2d
method:
  name: ufno
  kwargs:
    in_channels: 1
    out_channels: 1
    width: 36
    modes: 12
    padding: 8
    dropout: 0.0
    geometry_channels: 1
training:
  # The official U-FNO release uses batch size four and Adam.  This 2-D
  # sparse-observation adaptation keeps that batch size and uses FP32 because
  # its Fourier transforms and batch-normalized U branches are not AMP-gated.
  batch_size: 4
  optimizer: adam
  mixed_precision: false
