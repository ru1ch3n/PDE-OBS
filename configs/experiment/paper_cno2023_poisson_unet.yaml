schema_version: 2
name: paper-cno2023-poisson-unet
seed: 4
task: recovery

data:
  root: ${PDEOBS_DATA}
  train_glob: "poisson/**/*.h5"
  verify_shards: false
  allow_split_fallback: false
  split: iid
  target_time: -1
  state_representation: native
  spatial_resolution: [64, 64]
  train_max_samples: 1024
  validation_max_samples: 128
  test_max_samples: 256
  filters:
    pde: poisson
  mask:
    protocol: random_3pct

method:
  name: paper_unet
  kwargs:
    upstream_root: ${PDEOBS_OFFICIAL_CNO_ROOT}
    upstream_revision: bd9362c8c192d6f160129a7a85b1fe00d6c41523
    source_file_sha256: b0899a7047a8240dc365550e7d2dae7214bfad1b1500def604bd38236f5ed8dd
    paper_pde: poisson
    channels: 32
    initialization_seed: 4

training:
  epochs: 1000
  optimizer: adam
  batch_size: 10
  learning_rate: 0.001
  weight_decay: 0.0
  loss: relative_l1
  scheduler: step
  scheduler_step_size: 1
  scheduler_gamma: 0.98
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  checkpoint_every: 1
  device: auto
  mixed_precision: false
  grad_clip: null
  early_stopping_patience: 50
  deterministic: true

evaluation:
  include_frequency_bands: true
  include_stability: true

output:
  root: ${PDEOBS_RUNS}
