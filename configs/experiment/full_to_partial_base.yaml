schema_version: pdeobs.experiment/v1
name: full-to-partial-base
seed: 20260804
task: recovery

data:
  root: ${PDEOBS_DATA}
  train_glob: "**/*.h5"
  verify_shards: false
  allow_split_fallback: false
  split: iid
  target_time: -1
  state_representation: vorticity
  filters:
    pde: poisson
  mask:
    protocol: full
  required_factor_coverage:
    pde: [poisson]
    boundary: [dirichlet, neumann, periodic, robin_obstacle]
    setting:
      - smooth_grf
      - medium_grf
      - rough_grf
      - low_frequency_fourier
      - multi_frequency_fourier
      - gaussian_blobs
      - piecewise_blocks
      - threshold_level_set
      - dipole_vortex_pair
      - front_ring_shock
    regime: [low, medium, high]

training:
  epochs: 100
  batch_size: 4
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0001
  # The benchmark contains physically valid near-zero target fields. A
  # per-sample relative denominator overweights those records by many orders of
  # magnitude, so training uses a shared finite MSE objective while evaluation
  # continues to report relative-L2 and the full metric suite.
  loss: mse
  scheduler: step
  scheduler_step_size: 1
  scheduler_gamma: 0.98
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  checkpoint_every: 1
  device: auto
  mixed_precision: true
  grad_clip: 1.0
  early_stopping_patience: 20
  deterministic: true
  health_policy: fail
  loss_spike_ratio: 10.0
  loss_spike_consecutive_windows: 3
  # Mini-batches intentionally mix boundaries, settings, and regimes whose
  # finite losses are not directly comparable. Detect sustained divergence on
  # epoch aggregates; retain the same ratio and consecutive-window thresholds.
  loss_spike_scope: epoch
  gradient_norm_warning: 1000.0
  gradient_warning_consecutive_windows: 3
  output_std_ratio_collapse_max: 0.0001
  collapse_consecutive_windows: 100
  validation_improvement_min_fraction: 0.01

evaluation:
  include_frequency_bands: true
  include_stability: true
  observation_protocols:
    - full
    - random_1pct
    - random_3pct
    - random_5pct
    - random_10pct
    - regular_grid
    - block_missing
    - line_sensors
    - boundary_sensors
    - clustered_sensors

output:
  root: ${PDEOBS_RUNS}
