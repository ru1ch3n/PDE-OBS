learned_methods: [ufno_2d, fno, cno, deeponet, gnot, transolver, pino]
training_rows: 441
test_views_per_checkpoint: 9
possible_learned_blocks: 3969
observation_definition: observations.yaml
training_cohort_definition: training_cohorts.yaml
scoring:
  release_default: pdeobs-strict-v1
  preserve_historical_scoring_version: true
  legacy_results_automatically_strict_validated: false
  test_records_per_paper_block: 200
  missing_result_marker: RESULT_PENDING
paths:
  data_root: ${PDEOBS_DATA:-./paper-data}
  output_root: ${PDEOBS_RUNS:-./paper-runs}
