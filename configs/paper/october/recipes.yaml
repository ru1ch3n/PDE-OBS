# Frozen training recipes of every October 2026 cohort, exported from the task files that ran.
# One entry per (cohort, dataset, method); the recipe is identical across the listed protocols and seeds.
# Historical (P4 / P5) and method-tuned (V4-*) cohorts are separate and are never re-interpreted by newer defaults.
schema: pdeobs-october-recipes/v1
cohorts:
  P4: V2 main matrix, frozen V2 recipe (FNO / Voronoi-CNN); historical cohort, recipes chosen on the V2 dev screen
  P5: V2 CNO, frozen V2 recipe
  V4C: V4-C method-tuned formal runs (recipe = top-2 variant with the best validation score at 20,000 updates)
  V4D: V4-D layout / density specialists (FNO V4-C recipe; Voronoi-CNN frozen recipe)
  V4E: V4-E NS rough information control (partial / full initial state x viscosity hidden / provided)
  N3GJ2: N3 jitter-augmented grid training (GJ2_K256), G256 specialist recipe
  N5MXR6: N5 NS medium two-density mixture (MXR6_K256_K1024), P4 recipe
  N6: 'N6 normalisation-only control: V4 recipe with the training-set normaliser OFF'
  RPB: external RPB Poisson, frozen Poisson recipes (FNO V4-C, Voronoi-CNN frozen V2)
  RPBn: 'RPB control: frozen Voronoi-CNN recipe + training-set normaliser (only change)'
  E6: 'E6 control: zero-fill FNO cohort copied with nearest-observation fill (only change)'
groups:
- cohort: E6
  dataset_id: v2_ns_ell009_ref128
  method: fno
  protocols:
  - MXR6_K256_K1024
  - U256
  seeds:
  - 1101
  - 1102
  - 1103
  recipe:
    method: fno
    lr: 0.0003
    batch_size: 8
    epochs: 250
    fill_input: nearest
    n_train: 9000
