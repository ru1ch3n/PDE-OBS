schema_version: pdeobs.paper-settings/v1

# A setting may enter a formal pdeobs.training-campaign/v2 plan only when its
# status is "verified" and every required source/revision/config attestation is
# present. These three existing implementations are intentionally fail-closed:
# they remain useful smoke/pilot references but are not exact paper settings.
settings:
  compact_mask_unet_v1:
    method: unet
    status: reference_only
    current_config: configs/experiment/core_pilot_unet.yaml
    current_implementation: src/pdeobs/methods/neural.py::MaskChannelUNet
    paper_url: https://arxiv.org/abs/1505.04597
    original_implementation_url: http://lmb.informatik.uni-freiburg.de/people/ronneber/u-net
    reason: >-
      The original U-Net is a biomedical segmentation network with valid
      convolutions, four down/up stages, a segmentation objective, and its own
      augmentation/training recipe. The repository model is a smaller
      mask-conditioned PDE regressor, so no exact original-paper setting exists
      for this adapted task yet.

  compact_fno2d_v1:
    method: fno
    status: reference_only
    current_config: configs/experiment/core_pilot_fno.yaml
    current_implementation: src/pdeobs/methods/neural.py::CompactFNO2d
    paper_url: https://arxiv.org/abs/2010.08895
    official_code_url: https://github.com/zongyi-li/fourier_neural_operator
    reason: >-
      Four Fourier layers, width 32, and 12 modes overlap the paper's reported
      two-dimensional setting, but the local normalization, activations,
      mask-conditioning, projection, optimizer, and sparse-recovery objective
      are not an exact reproduction of the paper or its official code.

  compact_cno2d_v1:
    method: cno
    status: reference_only
    current_config: configs/experiment/core_pilot_cno.yaml
    current_implementation: src/pdeobs/methods/neural.py::CompactCNO2d
    paper_url: https://arxiv.org/abs/2302.01178
    official_code_url: https://github.com/camlab-ethz/ConvolutionalNeuralOperator
    official_setting_root: CNO2d_classic
    reason: >-
      This repository contains a compact anti-aliased CNO-like model, not the
      NeurIPS 2023 CNO2d_classic architecture. The official repository uses
      PDE-specific selected hyperparameters; those must be mapped and pinned
      before a formal setting can be marked verified.

  cno2023_poisson_unet:
    method: paper_unet
    status: verified
    supported_pdes: [poisson]
    reproduction_scope: paper_architecture_training_with_declared_task_adapter
    paper_url: https://arxiv.org/abs/2302.01178
    supplement_url: https://proceedings.neurips.cc/paper_files/paper/2023/file/f3c1951b34f7f55ffaecada7fde6bd5a-Supplemental-Conference.pdf
    official_code_url: https://github.com/camlab-ethz/ConvolutionalNeuralOperator
    official_code_revision: bd9362c8c192d6f160129a7a85b1fe00d6c41523
    official_source_file: _OtherModels/BaselinesModules.py
    official_source_sha256: b0899a7047a8240dc365550e7d2dae7214bfad1b1500def604bd38236f5ed8dd
    source_setting_locator: >-
      Supplement C.2 and Table 7 Poisson row; author source
      _OtherModels/BaselinesModules.py::UNetOrg and _OtherModels/TrainUNet.py.
    local_config: configs/experiment/paper_cno2023_poisson_unet.yaml
    local_config_sha256: f871a291dcbc2c72e53c8c2d83295a188e183893f8a8815e320a25ac44c5a1d5
    paper_setting:
      epochs: 1000
      optimizer: adam
      loss: relative_l1
      batch_size: 10
      learning_rate: 0.001
      scheduler_gamma_each_epoch: 0.98
      weight_decay: 0.0
      channels: 32
      training_samples: 1024
      validation_samples: 128
      test_samples: 256
    task_adapter:
      input_policy: zero_filled_visible_target_field
      spatial_adapter: deterministic_area_average_128_to_64_before_mask_v1
      mask_channel_added: false
      official_architecture_unchanged: true
      full_observation_control: required
      normalization: canonical_pdeobs_physical_units
      claim_limit: not_an_exact_reproduction_of_the_paper_forward_operator_dataset

