[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdeobs"
version = "0.2.1"
description = "Physical-field recovery and forecasting under partial observations (v0.2.0 unified user API)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "PDE-OBS contributors" }]
keywords = ["partial differential equations", "neural operators", "benchmark", "partial observation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.12",
  "h5py>=3.8",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
train = ["torch>=2.1"]
paper = ["torch>=2.1", "setuptools>=68,<81", "requests==2.31.0"]
analysis = ["pandas>=2.0", "matplotlib>=3.7"]
site = ["bibtexparser>=1.4.0", "beautifulsoup4>=4.12"]
test = ["pytest>=7.4", "pytest-cov>=4.1"]
dev = [
  "torch>=2.1",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "bibtexparser>=1.4.0",
  "beautifulsoup4>=4.12",
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.5",
]

[project.scripts]
pdeobs = "pdeobs.cli:main"

[project.entry-points."pdeobs.pdes"]
# Third-party packages can register PDE solvers here.

[project.entry-points."pdeobs.methods"]
# Third-party packages can register benchmark methods here.

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["pdeobs*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP038"]
